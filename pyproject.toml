[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adag"
version = "0.1.0"
description = "AI-Driven Architecture Guardrail — audit Terraform/IaC against architecture policies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["terraform", "iac", "policy", "compliance", "llm", "langchain", "langgraph"]
dependencies = [
    "langgraph>=0.2.45",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langchain-core>=0.3.15",
    "langchain-aws>=0.2.6",
    "boto3>=1.35.36",
    "botocore>=1.35.36",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.2",
    "requests>=2.31.0",
    "click>=8.1.0",
]

[project.scripts]
adag = "adag.cli:main"

[project.optional-dependencies]
rag = [
    "chromadb>=0.4.22",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adag*", "agents*", "core*", "models*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["policies/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
