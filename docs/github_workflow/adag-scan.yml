name: ADAG — Terraform Governance Scan

on:
  pull_request:
    paths:
      - "infrastructure/**/*.tf"
  workflow_dispatch:

jobs:
  adag-scan:
    name: Audit Terraform Governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ADAG
        run: pip install git+https://github.com/m3dcodie/arch_agent.git

      - name: Run ADAG scan
        id: scan-json
        env:
          LLM_PROVIDER: github-copilot
          GITHUB_COPILOT_TOKEN: ${{ secrets.GH_COPILOT_TOKEN }}
          INTAKE_MODEL: ${{ vars.INTAKE_MODEL }}
          AUDITOR_MODEL: ${{ vars.AUDITOR_MODEL }}
          LLM_TEMPERATURE: "0"
          LLM_MAX_TOKENS: "4096"
          USE_RAG: "false"
        run: |
          set +e
          adag scan ./infrastructure/ --format json --policies-dir "${{ github.workspace }}/policies" > results.json 2>scan-stderr.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Convert JSON results to SARIF
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os

          raw = open("results.json").read().strip() if os.path.exists("results.json") else ""
          if not raw:
              json.dump({"$schema": "https://json.schemastore.org/sarif-2.1.0.json", "version": "2.1.0",
                         "runs": [{"tool": {"driver": {"name": "ADAG", "version": "1.2.1", "rules": []}}, "results": []}]},
                        open("results.sarif.json", "w"), indent=2)
              print("SARIF: scan produced no output — writing empty SARIF.")
              exit(0)

          results = json.loads(raw)
          rules, sarif_results, seen = [], [], set()
          level_map = {"HIGH": "error", "MEDIUM": "warning", "LOW": "note"}

          for r in results:
              for v in r.get("violations", []):
                  if v["policy_ref"] not in seen:
                      seen.add(v["policy_ref"])
                      rules.append({
                          "id": v["policy_ref"],
                          "name": v["policy_ref"].replace("_", " ").title(),
                          "shortDescription": {"text": v.get("description", "")},
                      })
                  sarif_results.append({
                      "ruleId": v["policy_ref"],
                      "level": level_map.get(v.get("severity", ""), "warning"),
                      "message": {"text": v.get("description", "") + (f" Fix: {v['remediation_hint']}" if v.get("remediation_hint") else "")},
                      "locations": [{"physicalLocation": {
                          "artifactLocation": {"uri": r["file_path"], "uriBaseId": "%SRCROOT%"},
                          "region": {"startLine": v.get("line_number") or 1},
                      }}],
                  })

          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{"tool": {"driver": {"name": "ADAG", "version": "1.2.1", "rules": rules}}, "results": sarif_results}],
          }
          json.dump(sarif, open("results.sarif.json", "w"), indent=2)
          print(f"SARIF: {len(sarif_results)} result(s) written.")
          EOF

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif.json
        continue-on-error: true

      - name: Post PR comment
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');

            let body = '';
            const exitCode = '${{ steps.scan-json.outputs.exit_code }}';

            try {
              // JSON output is an array of per-file results
              const fileResults = JSON.parse(fs.readFileSync('results.json', 'utf8'));
              const filesScanned = fileResults.length;
              const allViolations = fileResults.flatMap(r => r.violations || []);
              const totalViolations = allViolations.length;
              const errorFiles = fileResults.filter(r => r.status === 'error');

              if (errorFiles.length > 0) {
                const firstError = errorFiles[0].error_message || 'Unknown error — check workflow logs.';
                body = `## ⚠️ ADAG Governance Scan — ERROR\n\n`;
                body += `Scan failed on **${errorFiles.length}** file(s). Fix the configuration before results can be trusted.\n\n`;
                body += `**Error:** ${firstError}\n\n`;
                body += `**${filesScanned}** file(s) scanned · Exit code: \`${exitCode}\``;
              } else if (totalViolations === 0) {
                body = `## ✅ ADAG Governance Scan — PASSED\n\n`;
                body += `No policy violations found across all Terraform files.\n\n`;
                body += `**${filesScanned}** file(s) scanned · **0** violations`;
              } else {
                body = `## ❌ ADAG Governance Scan — FAILED\n\n`;
                body += `**${totalViolations}** violation(s) found. Fix these before merging.\n\n`;

                body += `| Resource | Policy | Severity | Detail |\n`;
                body += `|---|---|---|---|\n`;
                for (const v of allViolations.slice(0, 20)) {
                  const resource = v.resource_type && v.resource_name
                    ? `\`${v.resource_type}.${v.resource_name}\``
                    : '—';
                  const policy = v.policy_ref || '—';
                  const severity = v.severity || '—';
                  const detail = (v.description || v.remediation_hint || '').substring(0, 80);
                  body += `| ${resource} | ${policy} | ${severity} | ${detail} |\n`;
                }
                if (totalViolations > 20) {
                  body += `\n_...and ${totalViolations - 20} more. See the Security tab for full results._\n`;
                }

                body += `\n**${filesScanned}** file(s) scanned · **${totalViolations}** violation(s) · Exit code: \`${exitCode}\``;
              }
            } catch (e) {
              body = `## ⚠️ ADAG Governance Scan — ERROR\n\nCould not parse scan results. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\n\`\`\`\n${e.message}\n\`\`\``;
            }

            body += `\n\n---\n_Powered by [ADAG](https://github.com/m3dcodie/arch_agent) · [View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('ADAG Governance Scan')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload scan artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adag-results
          path: |
            results.json
            results.sarif.json
            scan-stderr.txt
          retention-days: 30

      - name: Fail build on violations
        if: steps.scan-json.outputs.exit_code == '1'
        run: |
          echo "ADAG found governance violations. Fix them before merging."
          exit 1

      - name: Fail build on scan error
        if: steps.scan-json.outputs.exit_code == '2'
        run: |
          echo "ADAG scan failed with an error. Check scan-stderr.txt in the uploaded artefacts."
          cat scan-stderr.txt || true
          exit 2
